[package]
name = "barracks"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "=3.7.0", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
rfd = "=0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "accessibility"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.dev]
debug = 0
